<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Loai Amr</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="https://github.com/Loai-amr.png">
  <!-- Self-contained: GitHub Pages serves this for any missing URL, at any depth. -->
  <style>
    :root {
      --bg: #f5f5f7; --card: #ffffff; --text: #111114; --muted: #6b6b76; --border: #e4e4ea;
      --accent: #6d5efc; --term-bg: #15151b; --term-text: #e6e6ef; --term-muted: #8d8d9b; --ok: #3ddc97; --err: #ff6b81;
      --shadow: 0 18px 40px -22px rgba(17, 17, 20, .35);
      --ease: cubic-bezier(.2, .7, .2, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d0d10; --card: #17171c; --text: #f2f2f5; --muted: #9a9aa6; --border: #2a2a33; --accent: #8f84ff;
              --term-bg: #101015; --shadow: 0 18px 40px -22px rgba(0, 0, 0, .8); }
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: grid; place-items: center; padding: 32px 16px; text-align: center;
      background:
        radial-gradient(55% 45% at 50% 30%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { width: min(100%, 440px); }

    .code { display: flex; justify-content: center; gap: 4px; margin-bottom: 10px;
      font-size: clamp(5.5rem, 24vw, 8rem); font-weight: 800; line-height: 1; letter-spacing: -.05em; color: var(--accent); }
    .code span { display: inline-block; animation: drop .7s var(--ease) both; }
    .code span:nth-child(2) { animation: drop .7s var(--ease) .08s both, wobble 4s ease-in-out 1.2s infinite; }
    .code span:nth-child(3) { animation-delay: .16s; }

    h1 { font-size: clamp(1.3rem, 5vw, 1.6rem); letter-spacing: -.01em; margin-bottom: 8px; animation: rise .6s var(--ease) .25s both; }
    .lead { color: var(--muted); line-height: 1.55; margin-bottom: 24px; animation: rise .6s var(--ease) .32s both; }

    /* Mini terminal */
    .term {
      text-align: left; margin: 0 auto 28px; border-radius: 14px; overflow: hidden;
      background: var(--term-bg); box-shadow: var(--shadow); border: 1px solid color-mix(in srgb, var(--term-text) 8%, transparent);
      animation: rise .6s var(--ease) .4s both;
    }
    .term-bar { display: flex; gap: 6px; padding: 10px 12px; background: color-mix(in srgb, var(--term-text) 6%, transparent); }
    .term-bar i { width: 10px; height: 10px; border-radius: 50%; background: #ff5f57; }
    .term-bar i:nth-child(2) { background: #febc2e; }
    .term-bar i:nth-child(3) { background: #28c840; }
    .term pre {
      margin: 0; padding: 14px 16px 16px; min-height: 92px; white-space: pre-wrap; word-break: break-all;
      font: .86rem/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--term-text);
    }
    .prompt { color: var(--ok); }
    .err { color: var(--err); }
    .dim { color: var(--term-muted); }
    .caret { display: inline-block; width: .55em; height: 1.05em; vertical-align: -2px; background: var(--term-text); animation: blink 1s steps(1) infinite; }

    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 999px;
      background: var(--accent); color: #fff; font-weight: 600; text-decoration: none;
      box-shadow: 0 10px 24px -12px color-mix(in srgb, var(--accent) 80%, transparent);
      transition: transform .2s var(--ease);
      animation: rise .6s var(--ease) .48s both;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s var(--ease); }
    .btn:hover svg { transform: translateX(-3px); }

    @keyframes drop   { from { opacity: 0; transform: translateY(-24px); } to { opacity: 1; transform: none; } }
    @keyframes rise   { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes wobble { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-12deg); } 86% { transform: rotate(9deg); } 93% { transform: rotate(-4deg); } }
    @keyframes blink  { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="code" aria-hidden="true"><span>4</span><span>0</span><span>4</span></div>
    <h1>This page took a wrong turn.</h1>
    <p class="lead">The link might be broken, or the page has moved.</p>

    <div class="term" role="img" aria-label="Terminal: the requested page was not found">
      <div class="term-bar" aria-hidden="true"><i></i><i></i><i></i></div>
      <pre id="term" aria-hidden="true"></pre>
    </div>

    <a class="btn" id="home" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      Back home
    </a>
  </main>

  <script>
    (function () {
      // Home link: on a GitHub project site (user.github.io/Repo/...) the site lives under the first path segment
      var home = '/';
      if (/\.github\.io$/.test(location.hostname)) {
        var seg = location.pathname.split('/')[1];
        if (seg) home = '/' + seg + '/';
      }
      document.getElementById('home').href = home;

      // Terminal: type "cd <path>", then print the error
      var term = document.getElementById('term');
      var path = decodeURIComponent(location.pathname || '/missing-page');
      if (path.length > 60) path = path.slice(0, 57) + '...';
      var cmd = 'cd ' + path;
      var esc = function (t) { return t.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
      var prompt = '<span class="prompt">~ $</span> ';
      var result = '\n<span class="err">cd: no such file or directory</span>' +
                   '\n<span class="dim"># tip: try the button below</span>\n' + prompt + '<span class="caret"></span>';
      var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (reduce) { term.innerHTML = prompt + esc(cmd) + result; return; }
      var i = 0;
      term.innerHTML = prompt + '<span class="caret"></span>';
      setTimeout(function type() {
        i++;
        term.innerHTML = prompt + esc(cmd.slice(0, i)) + '<span class="caret"></span>';
        if (i < cmd.length) setTimeout(type, 35 + Math.random() * 45);
        else setTimeout(function () { term.innerHTML = prompt + esc(cmd) + result; }, 350);
      }, 900);
    })();
  </script>
</body>
</html>
