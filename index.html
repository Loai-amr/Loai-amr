<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loai Amr — Links</title>
  <meta name="description" content="All of Loai Amr's links in one place: website, shop, goals tracker and socials.">
  <meta property="og:title" content="Loai Amr — Links">
  <meta property="og:description" content="Website, shop, goals tracker and socials.">
  <meta property="og:image" content="https://github.com/Loai-amr.png">
  <link rel="icon" href="https://github.com/Loai-amr.png">
  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --card-hover: #fafafa;
      --text: #111114;
      --muted: #6b6b76;
      --border: #e4e4ea;
      --accent: #6d5efc;
      --shadow: 0 1px 2px rgba(17, 17, 20, .04), 0 4px 16px rgba(17, 17, 20, .04);
      --ease: cubic-bezier(.2, .7, .2, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d10;
        --card: #17171c;
        --card-hover: #1e1e25;
        --text: #f2f2f5;
        --muted: #9a9aa6;
        --border: #2a2a33;
        --accent: #8f84ff;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 56px 16px 40px;
      background:
        radial-gradient(60% 320px at 50% 0%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 75%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main { width: 100%; max-width: 480px; }

    header { text-align: center; margin-bottom: 32px; }
    .avatar {
      width: 96px; height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--card);
      box-shadow: 0 0 0 2px var(--accent);
    }
    h1 { margin-top: 16px; font-size: 1.375rem; font-weight: 700; letter-spacing: -.01em; }
    .bio { margin-top: 6px; color: var(--muted); font-size: .95rem; line-height: 1.5; }

    .section-label {
      margin: 24px 4px 10px;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    ul { list-style: none; padding: 0; display: grid; gap: 10px; }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform .2s var(--ease), border-color .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .link:hover {
      background: var(--card-hover); border-color: var(--accent); transform: translateY(-2px);
      box-shadow: 0 10px 24px -14px color-mix(in srgb, var(--accent) 70%, transparent);
    }
    .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .icon {
      flex: none;
      display: grid; place-items: center;
      width: 40px; height: 40px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      color: var(--accent);
      transition: background .2s ease, color .2s ease, transform .3s var(--ease);
    }
    .link:hover .icon { background: var(--accent); color: #fff; transform: rotate(-6deg) scale(1.05); }
    svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .text { flex: 1; min-width: 0; }
    .title { display: block; font-weight: 600; }
    .sub { display: block; margin-top: 2px; color: var(--muted); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .arrow { flex: none; color: var(--muted); transition: color .2s ease, transform .2s var(--ease); }
    .link:hover .arrow { color: var(--accent); transform: translate(2px, -2px); }
    .arrow svg { width: 18px; height: 18px; }

    footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: .8rem; }

    /* ---------- Entrance animations ---------- */
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes popIn  { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
    @keyframes ring   { from { box-shadow: 0 0 0 2px var(--accent), 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); }
                        to   { box-shadow: 0 0 0 2px var(--accent), 0 0 0 16px transparent; } }

    .avatar { animation: popIn .6s var(--ease) both, ring 1.4s ease-out .5s both; }
    h1   { animation: fadeUp .6s var(--ease) .08s both; }
    .bio { animation: fadeUp .6s var(--ease) .14s both; }
    /* --i is set per item in the markup; backwards fill keeps hover transforms working afterwards */
    .section-label, ul > li { animation: fadeUp .55s var(--ease) backwards; animation-delay: calc(.2s + var(--i, 0) * 55ms); }
    footer { animation: fadeUp .6s var(--ease) .7s backwards; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .link:hover, .link:hover .icon, .link:hover .arrow { transform: none; }
    }
  </style>
</head>
<body>

          <span class="text"><span class="title">Elementor x Claude Skill</span><span class="sub">Browse my store</span></span>

          <span class="text"><span class="title">TikTok</span><span class="sub">@loaiiamr</span></span>
          <span class="arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></span>

          <span class="text"><span class="title">LinkedIn</span><span class="sub">in/loai-amrr</span></span>
          <span class="arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg></span>

    <footer>© Loai Amr</footer>
  </main>
</body>
</html>
