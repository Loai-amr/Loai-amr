  <style>
    :root {
      --bg: #f5f5f7;
      --card: #ffffff;
      --card-hover: #fafafa;
      --text: #111114;
      --muted: #6b6b76;
      --border: #e4e4ea;
      --accent: #6d5efc;
      --shadow: 0 1px 2px rgba(17, 17, 20, .04), 0 4px 16px rgba(17, 17, 20, .04);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d10;
        --card: #17171c;
        --card-hover: #1e1e25;
        --text: #f2f2f5;
        --muted: #9a9aa6;
        --border: #2a2a33;
        --accent: #8f84ff;
        --shadow: none;
      }
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 56px 16px 40px;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main { width: 100%; max-width: 480px; }

    header { text-align: center; margin-bottom: 32px; }
    .avatar {
      width: 96px; height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--card);
      box-shadow: 0 0 0 2px var(--accent);
    }
    h1 { margin-top: 16px; font-size: 1.375rem; font-weight: 700; letter-spacing: -.01em; }
    .bio { margin-top: 6px; color: var(--muted); font-size: .95rem; line-height: 1.5; }

    .section-label {
      margin: 24px 4px 10px;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    ul { list-style: none; padding: 0; display: grid; gap: 10px; }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    .link:hover { background: var(--card-hover); border-color: var(--accent); transform: translateY(-1px); }
    .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .icon {
      flex: none;
      display: grid; place-items: center;
      width: 40px; height: 40px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      color: var(--accent);
    }
    svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .logos { flex: none; display: flex; }
    .logos .icon + .icon { margin-left: -8px; }
    .icon.brand { background: var(--border); box-shadow: 0 0 0 2px var(--card); }
    .icon.brand svg { width: 24px; height: 24px; fill: currentColor; stroke: none; }
    .icon.claude { color: #d97757; }
    .link:hover .icon.brand { box-shadow: 0 0 0 2px var(--card-hover); }

    .text { flex: 1; min-width: 0; }
    .title { display: block; font-weight: 600; }
    .sub { display: block; margin-top: 2px; color: var(--muted); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .arrow { flex: none; color: var(--muted); }
    .arrow svg { width: 18px; height: 18px; }

    footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: .8rem; }

    @media (prefers-reduced-motion: reduce) { .link { transition: none; } .link:hover { transform: none; } }
  </style>
